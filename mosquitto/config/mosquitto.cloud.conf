# Used only for the Render deployment (see render.yaml / DEPLOY.md).
# Plain MQTT, not TLS: this broker is a Render private service, unreachable
# from the public internet - only other services in the same Render
# environment can reach it. Local `docker compose up` uses mosquitto.conf
# instead, which is TLS-secured against a locally-generated CA.
listener 1883
allow_anonymous true
log_dest stdout
