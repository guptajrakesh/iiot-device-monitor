services:
  # Everything in one container: Render's free plan only offers the Web
  # Service type, and (confirmed via a live deploy) short internal hostnames
  # don't resolve between separate Web Services on that plan - there's no
  # usable private network to split this across services the way local
  # docker-compose does. See render/entrypoint.sh for how the pieces run as
  # sibling processes talking over localhost instead.
  - type: web
    name: iiot-device-monitor
    runtime: docker
    plan: free
    dockerfilePath: render/Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Timescale Cloud connection string here
